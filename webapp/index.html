<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBite - Panel de pruebas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <h1>SmartBite API</h1>
            <p class="subtitulo">Aplicación Web con Jakarta EE, Fetch, JSON y MySQL</p>

            <div class="botones-seccion">
                <button id="btnUsuarios" class="btn-accion">Listar usuarios</button>
                <button id="btnRecetas" class="btn-accion">Listar recetas</button>
                <button id="btnIngredientes" class="btn-accion">Listar ingredientes</button>
            </div>

            <form id="formBuscarUsuario" class="buscador">
                <input type="email" id="emailBusqueda" name="emailBusqueda" placeholder="Buscar usuario por email..." >
                <button type="submit">Buscar</button>
            </form>

            <div id="estado" class="estado"></div>
            <div id="resultados" class="resultados"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
